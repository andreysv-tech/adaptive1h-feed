name: Collect public market candles
on:
  schedule:
    # UTC, 24/7: no timezone parser or DST-dependent hour window.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      verify_bybit:
        description: 'Also probe all 36 Bybit Spot frames (diagnostic only)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: adaptive1h-candle-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test collector, validation and independent feed
        run: |
          python -m unittest discover -s tests -v
          node --test live_worker.test.mjs
      - name: Optional direct Bybit verification
        if: inputs.verify_bybit == true
        continue-on-error: true
        run: python collector.py --exchange Bybit --output "$RUNNER_TEMP/bybit-probe"
      - name: Collect, validate, publish and verify six assets
        run: bash refresh-feed.sh collect
